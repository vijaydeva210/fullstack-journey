<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <p id="p1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic ratione cum deserunt ea, ullam nihil id voluptas nulla vitae laboriosam maiores porro recusandae maxime nesciunt aliquid sit facere, distinctio inventore?</p>
        <button class="buttons">Blue</button>
        <button class="buttons">RED</button>
        <button class="buttons">green</button>
        <script>
            let btns=document.querySelectorAll('.buttons');
            for(let btn of btns){
                btn.addEventListener('click',changecolor);
                btn.addEventListener('mouseover',changebackcolor);
            }
            function changecolor(event){
                let p_tag;
                p_tag=document.getElementById('p1');
                p_tag.style.color=event.target.innerText;
            }
            function changebackcolor(event){
                let p_tag=document.querySelector('#p1');
                p_tag.style.backgroundColor=event.target.innerText;
            }
        </script>
    </body>
</html>
