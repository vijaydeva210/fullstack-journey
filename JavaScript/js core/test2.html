<!DOCTYPE html>

    <body>
        <div id="Parent">
            <input type="button" value="1" id="b1">
            <input type="button" value="2" id="b2">
            <input type="button" value="3" id="b3">
        </div>
        <script>
            document.getElementById('b1').addEventListener('click',response)
            document.getElementById('b2').addEventListener('click',response)
            document.getElementById('b3').addEventListener('click',response)
            document.getElementById('Parent').addEventListener('click',response1)
            function response(event){
                console.log(event.target.value)
                console.log('from child')
            }
            function response1(event){
                console.log(event.target.value)
                console.log('from parent')
            }
        </script>
    </body>
