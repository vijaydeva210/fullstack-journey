<!DOCTYPE html>
<html>
    <head>
        <title>calci</title>
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body>
        <label for="" class="calci">
            <div class='display'>
                <input type="text" id="display_text" readonly>
            </div>
            <div class="buttons">
                <button id="_1">1</button>
                <button id="_2">2</button>
                <button id="_3">3</button>
                <button id="_4">4</button>
                <button id="_5">5</button>
                <button id="_6">6</button>
                <button id="_7">7</button>
                <button id="_8">8</button>
                <button id="_9">9</button>
                <button id="_0">0</button>
                <button id="plus">+</button>
                <button id="minus">-</button>
                <button id="mul">*</button>
                <button id="div">/</button>
                <button id="C">C</button>
                <button id="AC">AC</button>
                <button id="eq">=</button>
            </div>
        </label>

        <script src="calculator.js"></script>
    </body>
</html>
