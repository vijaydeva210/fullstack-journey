<!DOCTYPE html>
<html>
    <head>
    <link rel="stylesheet" href="shopping.css">
    </head>
    <body>
        <div class="container">
            <div class="heading">
                <div class="name">
                    <p><strong>VD</strong>carts</p>
                </div>
                <div class="address">
                    <p>Deliver to</p>
                    <p>India</p>
                </div>
                <div class="searchbar">
                    <input type="text">
                    <button>search</button>
                </div>
                <div class="cart">
                    <img src="cart.png" alt="">
                </div>
            </div>
            <div class="shop">
                <button>Shop Now</button>
            </div>
            <div class="main">
                <div class="item tv">
                    <div class="img img1">
                         <img src="monitor.png" alt="">
                    </div>
                    <div class="details">
                        <p><strong>$2999</strong></p>
                        <p>TeleVision</p>
                    </div>
                   
                </div>
                <div class="item mobile">
                    <div class="img img2">
                        <img src="iphone.png" alt="">
                    </div>
                    <div class="details">
                        <p><strong>$1999</strong></p>
                        <p>Iphone</p>
                    </div>
                </div>
                <div class="item watch">
                    <div class="img img3">
                        <img src="watch.png" alt="">
                    </div>
                    <div class="details">
                        <p><strong>$999</strong></p>
                        <p>Apple Watch Series 7</p>
                    </div>
                </div>
                <div class="item laptop">
                    <div class="img img4">
                        <img src="laptop.png" alt="">
                    </div>
                    <div class="details">
                        <p><strong>$1599</strong></p>
                        <p>Lenevo Ideapad</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
